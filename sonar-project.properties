# =============================================================================
# SonarQube Cloud — análisis estático de iAnswer
# -----------------------------------------------------------------------------
# Lo ejecuta .github/workflows/sonarqube.yml. Requiere el secret SONAR_TOKEN en
# GitHub y el Automatic Analysis APAGADO en SonarQube Cloud (los dos modos a la
# vez hacen fallar el análisis).
#
# projectKey y organization son los que SonarQube Cloud propone al importar el
# repo desde GitHub; si al crear el proyecto salen otros, cámbialos aquí.
# =============================================================================

sonar.projectKey=42labaianswer_ianswer
sonar.organization=42labaianswer
sonar.projectName=iAnswer

sonar.sources=src,robots.ts,next.config.ts
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json

# src/workflows son exportaciones de n8n (no es código de la app).
sonar.exclusions=src/workflows/**,**/node_modules/**,.next/**,public/**,src/**/*.test.ts

sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts

# Cobertura de Vitest (npm run test:coverage, ver vitest.config.ts).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# La cobertura se exige solo a la lógica de src/lib, que es lo que tiene tests
# unitarios. La UI (páginas, componentes, hooks), las rutas de API y la config
# quedan fuera hasta que haya tests para ellas.
sonar.coverage.exclusions=src/app/**,src/components/**,src/hooks/**,src/types/**,src/proxy.ts,robots.ts,next.config.ts
